<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear usuario | Administración NutriVida</title>
    <link rel="stylesheet" href="assets/css/estilos.css">
</head>

<body>

<header>
    <div class="marca">
        <div class="logo">NV</div>
        <div>
            <h1>NutriVida</h1>
            <p>Administración de usuarios</p>
        </div>
    </div>

    <nav aria-label="Navegación de administración">
        <a href="admin.html">Inicio</a>
        <a href="admin-productos.html">Productos</a>
        <a href="admin-usuarios.html">Usuarios</a>
        <a href="index.html">Volver al sitio</a>
    </nav>
</header>

<main>

    <section class="hero">
        <p class="eyebrow">ADMINISTRACIÓN</p>
        <h2>Crear usuario.</h2>
        <p>
            Ingresa los datos del nuevo usuario de NutriVida.
        </p>
    </section>

    <section class="card">

        <h2>Datos del usuario</h2>

        <form id="form-usuario" novalidate>

            <label for="run">RUN</label>
            <input
                type="text"
                id="run"
                name="run"
                placeholder="Ej: 19011022K"
                required
            >

            <label for="nombre">Nombre</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                maxlength="50"
                placeholder="Ingresa el nombre"
                required
            >

            <label for="apellidos">Apellidos</label>
            <input
                type="text"
                id="apellidos"
                name="apellidos"
                maxlength="100"
                placeholder="Ingresa los apellidos"
                required
            >

            <label for="correo">Correo electrónico</label>
            <input
                type="email"
                id="correo"
                name="correo"
                maxlength="100"
                placeholder="ejemplo@gmail.com"
                required
            >

            <label for="fecha-nacimiento">Fecha de nacimiento</label>
            <input
                type="date"
                id="fecha-nacimiento"
                name="fecha-nacimiento"
            >

            <label for="tipo-usuario">Tipo de usuario</label>
            <select
                id="tipo-usuario"
                name="tipo-usuario"
                required
            >
                <option value="">Selecciona un perfil</option>
                <option value="Administrador">Administrador</option>
                <option value="Cliente">Cliente</option>
                <option value="Vendedor">Vendedor</option>
            </select>

            <label for="region">Región</label>
            <select
                id="region"
                name="region"
                required
            >
                <option value="">Selecciona una región</option>
            </select>

            <label for="comuna">Comuna</label>
            <select
                id="comuna"
                name="comuna"
                required
                disabled
            >
                <option value="">Selecciona una comuna</option>
            </select>

            <label for="direccion">Dirección</label>
            <textarea
                id="direccion"
                name="direccion"
                maxlength="300"
                placeholder="Ingresa la dirección"
                required
            ></textarea>

            <div class="acciones">
                <button type="submit">Guardar usuario</button>

                <a
                    href="admin-usuarios.html"
                    class="btn btn-secundario"
                >
                    Cancelar
                </a>
            </div>

            <p
                id="mensaje-usuario"
                aria-live="polite"
            ></p>

        </form>

    </section>

</main>

<footer>
    <p>NutriVida · Panel de administración</p>
</footer>

<script src="assets/js/admin-usuario.js"></script>

</body>
</html>
