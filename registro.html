<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Registro de usuario en Clínica NutriVida">

    <title>Registro | NutriVida</title>

    <link rel="stylesheet" href="assets/css/estilos.css">
</head>

<body>

    <header>
        <div class="logo">NV</div>

        <div>
            <h1>NutriVida</h1>
            <p>Clínica de nutrición y dietética</p>
        </div>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="servicios.html">Servicios</a>
            <a href="productos.html">Productos</a>
            <a href="registro.html">Registro</a>
            <a href="index.html#contacto">Contacto</a>
        </nav>
    </header>

    <main>

        <section class="hero">
            <p class="eyebrow">REGISTRO</p>

            <h2>Crea tu cuenta</h2>

            <p>
                Regístrate para acceder a los servicios de NutriVida.
            </p>
        </section>

        <section class="card">

            <form id="form-registro" novalidate>

                <p id="mensaje-registro"></p>

                <label for="nombre">Nombre completo</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ingresa tu nombre"
                    required
                >

                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="ejemplo@correo.com"
                    required
                >

                <label for="telefono">Teléfono</label>
                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="+56 9 1234 5678"
                    required
                >

                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa una contraseña"
                    required
                >

                <label for="password-confirmar">Confirmar contraseña</label>
                <input
                    type="password"
                    id="password-confirmar"
                    name="password-confirmar"
                    placeholder="Repite tu contraseña"
                    required
                >

                <button type="submit">Registrarme</button>

            </form>

        </section>

    </main>

    <footer>
        <p>NutriVida · Proyecto DSY1104</p>
    </footer>

    <script src="assets/js/registro.js"></script>

</body>
</html>
