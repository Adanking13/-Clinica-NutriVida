<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Registro de usuario en Clínica NutriVida">

    <title>Registro | NutriVida</title>

    <link rel="stylesheet"
        href="assets/css/estilos.css">

</head>

<body>

    <header>

        <div class="marca">

            <div class="logo">
                NV
            </div>

            <div>
                <h1>NutriVida</h1>
                <p>Clínica de nutrición y dietética</p>
            </div>

        </div>
        <button type="button" class="nav-toggle" id="boton-menu" aria-expanded="false" aria-controls="menu-principal" aria-label="Abrir menú de navegación">
            <span aria-hidden="true">&#9776;</span>
        </button>
        <nav id="menu-principal" aria-label="Navegación principal">
            <a href="index.html">Inicio</a>

            <a href="nosotros.html">La clínica</a>

            <a href="nutricionistas.html">Nutricionistas</a>

            <a href="servicios.html">Servicios</a>

            <a href="productos.html">Productos</a>

            <a href="blogs.html">Blogs</a>

            <a href="reserva.html">Agendar cita</a>

            <a href="recursos.html">Recursos</a>

            <a href="login.html">Iniciar sesión</a>

        </nav>

    </header>

    <main>

        <section class="hero">

            <p class="eyebrow">
                REGISTRO
            </p>

            <h2>
                Crea tu cuenta
            </h2>

            <p>
                Regístrate para acceder a los servicios de NutriVida.
            </p>

        </section>

        <section class="card">

            <form id="form-registro" novalidate>

                <p id="mensaje-registro" aria-live="polite"></p>

                <label for="run">
                    RUN
                </label>

                <input
                    type="text"
                    id="run"
                    name="run"
                    maxlength="9"
                    placeholder="Ej: 190110222"
                    required
                >

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    maxlength="50"
                    placeholder="Ingresa tu nombre"
                    required
                >

                <label for="apellidos">
                    Apellidos
                </label>

                <input
                    type="text"
                    id="apellidos"
                    name="apellidos"
                    maxlength="100"
                    placeholder="Ingresa tus apellidos"
                    required
                >

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    maxlength="100"
                    placeholder="ejemplo@gmail.com"
                    required
                >

                <label for="fecha-nacimiento">
                    Fecha de nacimiento
                </label>

                <input
                    type="date"
                    id="fecha-nacimiento"
                    name="fecha-nacimiento"
                >

                <label for="region">
                    Región
                </label>

                <select
                    id="region"
                    name="region"
                    required
                >
                    <option value="">
                        Selecciona una región
                    </option>
                </select>

                <label for="comuna">
                    Comuna
                </label>

                <select
                    id="comuna"
                    name="comuna"
                    required
                    disabled
                >
                    <option value="">
                        Selecciona una comuna
                    </option>
                </select>

                <label for="direccion">
                    Dirección
                </label>

                <textarea
                    id="direccion"
                    name="direccion"
                    maxlength="300"
                    placeholder="Ingresa tu dirección"
                    required
                ></textarea>

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="4"
                    maxlength="10"
                    placeholder="Entre 4 y 10 caracteres"
                    required
                >

                <label for="password-confirmar">
                    Confirmar contraseña
                </label>

                <input
                    type="password"
                    id="password-confirmar"
                    name="password-confirmar"
                    minlength="4"
                    maxlength="10"
                    placeholder="Repite tu contraseña"
                    required
                >

                <button type="submit">
                    Registrarme
                </button>

            </form>

        </section>

    </main>

    <footer>

        <p>
            NutriVida · Proyecto DSY1104
        </p>

    </footer>

    <script src="assets/js/registro.js"></script>
    <script src="assets/js/menu.js"></script>
</body>

</html>
